<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ولد عطاء - محادثة واتصال</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI';background:#0a0a1a;color:white;min-height:100vh}
.header{background:linear-gradient(90deg,#0f0c29,#302b63);padding:12px;text-align:center;border-bottom:2px solid #ff6a00}
.tabs{display:flex;background:rgba(255,255,255,0.06);padding:6px;gap:6px}
.tab{flex:1;padding:10px;border-radius:12px;text-align:center;cursor:pointer;background:rgba(255,255,255,0.08)}
.tab.active{background:linear-gradient(45deg,#ff6a00,#ee0979);font-weight:bold}
.list{padding:8px}
.item{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(255,255,255,0.07);border-radius:16px;margin:6px 0;cursor:pointer}
.avatar{width:45px;height:45px;border-radius:50%;background:linear-gradient(45deg,#ff6a00,#ee0979);display:flex;align-items:center;justify-content:center;font-weight:bold}
.btnCall{margin-left:auto;display:flex;gap:6px}
.callBtn{width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;color:white;font-size:16px}
.voice{background:#00c851} .video{background:#2979ff}
#chatScreen{position:fixed;inset:0;background:#0f0c29;z-index:10;display:none;flex-direction:column}
.chatHeader{padding:12px;background:rgba(0,0,0,0.5);display:flex;align-items:center;gap:10px}
#chatBox{flex:1;overflow-y:auto;padding:10px;background:rgba(0,0,0,0.3)}
.msg{margin:6px 0;padding:10px 14px;border-radius:15px;max-width:80%}
.me{background:linear-gradient(45deg,#ff6a00,#ee0979);margin-left:auto}
.other{background:rgba(255,255,255,0.15)}
.inputBar{display:flex;gap:6px;padding:10px;background:rgba(0,0,0,0.5)}
input{flex:1;padding:12px;border-radius:20px;border:none;background:rgba(255,255,255,0.12);color:white;outline:none}
.sendBtn{padding:10px 18px;border-radius:20px;border:none;background:linear-gradient(45deg,#ff6a00,#ee0979);color:white;font-weight:bold}
#callScreen{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center}
#remoteVideo{width:100%;height:100%;object-fit:cover}
#localVideo{position:absolute;top:20px;right:20px;width:110px;height:150px;border-radius:15px;border:2px solid #ff6a00;object-fit:cover}
</style>
</head>
<body>
<div class="header">
<h2 style="background:linear-gradient(45deg,#ff6a00,#ee0979);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900">👑 ولد عطاء - WALAD ATAA</h2>
<p style="font-size:11px;opacity:0.7"><span style="width:8px;height:8px;background:#00ff88;border-radius:50%;display:inline-block"></span> متصل • شاشة محادثة وقائمة اتصال</p>
</div>

<div class="tabs">
<div class="tab active" onclick="showTab('chats')">💬 محادثات</div>
<div class="tab" onclick="showTab('calls')">📞 مكالمات</div>
<div class="tab" onclick="showTab('contacts')">👥 جهات</div>
</div>

<div id="chats" class="list"></div>
<div id="calls" class="list" style="display:none"></div>
<div id="contacts" class="list" style="display:none"></div>

<!-- شاشة المحادثة -->
<div id="chatScreen">
<div class="chatHeader">
<button onclick="closeChat()" style="background:none;border:none;color:white;font-size:20px">⬅️</button>
<div class="avatar" id="chatAvatar">W</div>
<div style="flex:1"><b id="chatName">ولد عطاء</b><br><span style="font-size:11px;color:#00ff88">متصل الآن</span></div>
<div class="btnCall"><button class="callBtn voice" onclick="startCall(false)">📞</button><button class="callBtn video" onclick="startCall(true)">🎥</button></div>
</div>
<div id="chatBox"></div>
<div class="inputBar">
<input id="myName" value="ولد عطاء" style="max-width:70px">
<input id="msgInput" placeholder="اكتب رسالة...">
<button class="sendBtn" onclick="sendMsg()">إرسال</button>
</div>
</div>

<!-- شاشة المكالمة -->
<div id="callScreen">
<video id="remoteVideo" autoplay playsinline></video>
<video id="localVideo" autoplay playsinline muted></video>
<div style="position:absolute;bottom:30px;display:flex;gap:15px">
<button class="callBtn" style="background:#ff1744;width:60px;height:60px;font-size:24px" onclick="endCall()">📴</button>
<button class="callBtn" id="muteBtn" style="background:rgba(255,255,255,0.2);width:60px;height:60px" onclick="toggleMute()">🎙️</button>
</div>
<p id="callStatus" style="position:absolute;top:20px;background:rgba(0,0,0,0.5);padding:6px 12px;border-radius:20px">جاري الاتصال...</p>
</div>

<script>
const firebaseConfig = { databaseURL: "https://imo-legend-default-rtdb.firebaseio.com" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentChat=null;
let pc, localStream, currentCallId=null;

// واجهة التبويب
function showTab(t){
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 document.querySelectorAll('.list').forEach(x=>x.style.display='none');
 document.getElementById(t).style.display='block';
 event.target.classList.add('active');
}

// بيانات وهمية لقائمة جهات الاتصال
const contactsData = [
 {name:"ولد عطاء", last:"أهلاً يا أسطورة 🔥", time:"الآن"},
 {name:"أحمد الحديدة", last:"وينك؟", time:"١٠:٢٠"},
 {name:"صالح", last:"تم ✅", time:"أمس"},
 {name:"مجموعة الأساطير", last:"محمد: هلا والله", time:"أمس", group:true}
];

function renderLists(){
 let h='';
 contactsData.forEach((c,i)=>{
  h+=`<div class="item" onclick="openChat('${c.name}')">
   <div class="avatar">${c.name[0]}</div>
   <div style="flex:1"><b>${c.name}</b><br><span style="font-size:12px;opacity:0.6">${c.last}</span></div>
   <span style="font-size:11px;opacity:0.5">${c.time}</span>
   <div class="btnCall"><button class="callBtn voice" onclick="event.stopPropagation();openChat('${c.name}');startCall(false)">📞</button><button class="callBtn video" onclick="event.stopPropagation();openChat('${c.name}');startCall(true)">🎥</button></div>
  </div>`;
 });
 document.getElementById('chats').innerHTML=h;
 document.getElementById('contacts').innerHTML=h;
 document.getElementById('calls').innerHTML=`
   <div class="item"><div class="avatar">📞</div><div><b>أحمد الحديدة</b><br><span style="font-size:12px">مكالمة صادرة • ٢ دقيقة</span></div><span style="font-size:11px">اليوم</span></div>
   <div class="item"><div class="avatar">📹</div><div><b>صالح</b><br><span style="font-size:12px;color:#ff1744">مكالمة فائتة • فيديو</span></div><span style="font-size:11px">أمس</span></div>
 `;
}
renderLists();

function openChat(name){
 currentChat=name;
 document.getElementById('chatName').textContent=name;
 document.getElementById('chatAvatar').textContent=name[0];
 document.getElementById('chatScreen').style.display='flex';
 document.getElementById('chatBox').innerHTML='';
 db.ref('messages/'+name).limitToLast(50).off();
 db.ref('messages/'+name).limitToLast(50).on('child_added', snap=>{
  let d=snap.val();
  let div=document.createElement('div');
  let isMe = d.name==document.getElementById('myName').value;
  div.className='msg '+(isMe?'me':'other');
  div.innerHTML=`${d.text}`;
  document.getElementById('chatBox').appendChild(div);
  document.getElementById('chatBox').scrollTop=9999;
 });
}
function closeChat(){ document.getElementById('chatScreen').style.display='none'; db.ref('messages/'+currentChat).off(); }

function sendMsg(){
 let t=document.getElementById('msgInput').value.trim();
 if(!t||!currentChat) return;
 db.ref('messages/'+currentChat).push({name:document.getElementById('myName').value, text:t, time:Date.now()});
 document.getElementById('msgInput').value='';
}
document.getElementById('msgInput')?.addEventListener('keydown', e=>{ if(e.key=='Enter') sendMsg() });

// ===== نظام الاتصال WebRTC حقيقي =====
async function startCall(isVideo){
 document.getElementById('callScreen').style.display='flex';
 document.getElementById('callStatus').textContent='جاري الاتصال بـ '+currentChat+'...';
 try{
  localStream = await navigator.mediaDevices.getUserMedia({audio:true, video:isVideo});
  document.getElementById('localVideo').srcObject=localStream;
  currentCallId = 'call_'+Date.now();
  db.ref('calls/'+currentCallId).set({from:document.getElementById('myName').value, to:currentChat, video:isVideo, time:Date.now()});
  document.getElementById('callStatus').textContent='🔥 في مكالمة مع '+currentChat+' - الصوت شغال!';
  // محاكاة رد (في التطبيق الحقيقي الطرف الثاني يرد)
  setTimeout(()=>{document.getElementById('callStatus').textContent='✅ متصل - '+currentChat},1500);
 }catch(e){ alert('لازم تسمح بالميكروفون والكاميرا: '+e.message); endCall(); }
}
function endCall(){
 document.getElementById('callScreen').style.display='none';
 if(localStream) localStream.getTracks().forEach(t=>t.stop());
 if(currentCallId) db.ref('calls/'+currentCallId).remove();
}
function toggleMute(){
 if(!localStream) return;
 let track = localStream.getAudioTracks()[0];
 track.enabled=!track.enabled;
 document.getElementById('muteBtn').textContent= track.enabled?'🎙️':'🔇';
}
</script>
</body>
  </html>
