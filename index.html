<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>imo Legend</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
body{font-family:Cairo,sans-serif;background:#f4f7f6;margin:0;height:100vh;overflow:hidden}
.hidden{display:none!important}
#auth-screen{position:fixed;inset:0;background:#0084ff;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{background:#fff;padding:30px;border-radius:15px;width:100%;max-width:350px;text-align:center}
.logo{width:80px;height:80px;background:#0084ff;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;margin:0 auto 15px}
.input-field{width:90%;background:#f9f9f9;border:1px solid #e2e2e2;border-radius:10px;padding:12px;text-align:center;margin-bottom:15px;font-weight:600}
.btn-blue{width:98%;background:#0084ff;color:#fff;font-weight:bold;padding:12px;border-radius:10px;border:none}
.btn-green{width:98%;background:#00a884;color:#fff;font-weight:bold;padding:12px;border-radius:10px;border:none}
#app-screen{display:flex;flex-direction:column;height:100vh}
#app-screen header{background:#0084ff;color:#fff;padding:15px;display:flex;justify-content:space-between}
#chat-messages{flex:1;overflow-y:auto;padding:15px;background:#efeae2}
</style>
</head>
<body>
<div id="auth-screen">
<div class="auth-box">
<div class="logo">imo</div>
<h2 style="color:#0084ff;margin:0">imo Legend</h2>
<p style="color:gray;font-size:12px;margin-bottom:20px">مرحباً بك في النسخة المطورة</p>
<div id="phone-form">
<input id="phone-input" placeholder="رقم الهاتف (مثال: +967...)" class="input-field">
<input id="username-input" placeholder="اكتب اسمك هنا" class="input-field">
<button onclick="requestOTP()" class="btn-blue">متابعة وإرسال الرمز</button>
</div>
<div id="otp-form" class="hidden">
<p style="color:#00a884;font-size:12px;font-weight:bold">رمز التحقق التجريبي هو: 123456</p>
<input id="otp-input" placeholder="أدخل الرمز (6 أرقام)" class="input-field">
<button onclick="verifyOTP()" class="btn-green">تأكيد تسجيل الدخول</button>
</div>
</div>
</div>
<div id="app-screen" class="hidden">
<header><span>الدردشة العامة</span><button onclick="logout()" style="background:#ff4d4d;color:#fff;border:none;padding:6px 12px;border-radius:5px">خروج</button></header>
<div id="chat-messages"></div>
<div style="background:#fff;padding:10px;display:flex;gap:10px"><input id="message-input" style="flex:1;background:#f1f1f1;border:none;padding:12px;border-radius:10px" placeholder="اكتب رسالة..."><button onclick="sendMessage()" style="background:#0084ff;color:#fff;border:none;padding:12px 20px;border-radius:10px">إرسال</button></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyCBkGggHnBsLaSi0RH211cfbCFDBijH4BU",authDomain:"imo-legend.firebaseapp.com",databaseURL:"https://imo-legend-default-rtdb.firebaseio.com",projectId:"imo-legend",storageBucket:"imo-legend.firebasestorage.app",messagingSenderId:"930356255753",appId:"1:930356255753:web:bfca539599adbea4df6cd8"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let tempPhone='',tempUsername='';
function requestOTP(){const p=document.getElementById('phone-input').value.trim();const u=document.getElementById('username-input').value.trim();if(!p||!u){alert('أدخل البيانات كاملة!');return;}tempPhone=p;tempUsername=u;document.getElementById('phone-form').classList.add('hidden');document.getElementById('otp-form').classList.remove('hidden');}
function verifyOTP(){if(document.getElementById('otp-input').value.trim()!=='123456'){alert('الرمز هو 123456');return;}localStorage.setItem('imo_username',tempUsername);localStorage.setItem('imo_phone',tempPhone);document.getElementById('auth-screen').classList.add('hidden');document.getElementById('app-screen').classList.remove('hidden');}
function sendMessage(){const t=document.getElementById('message-input').value;const u=localStorage.getItem('imo_username');if(!t.trim())return;db.ref('chats').push({username:u,text:t,timestamp:Date.now()});document.getElementById('message-input').value='';}
function logout(){localStorage.clear();location.reload();}
db.ref('chats').limitToLast(50).on('value',snap=>{const box=document.getElementById('chat-messages');box.innerHTML='';snap.forEach(c=>{const m=c.val();box.innerHTML+=`<div style="background:#fff;padding:10px;margin:5px;border-radius:10px"><b style="color:#0084ff;font-size:11px">${m.username}</b><div>${m.text}</div></div>`;});});
</script>
</body>
</html>
